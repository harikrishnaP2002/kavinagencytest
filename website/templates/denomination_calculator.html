{% extends "base.html" %}

{% block title %}Denomination Calculator - Kavin Agency{% endblock %}

                            <th>Count</th>
                            <th>Value</th>

                    <tbody>
                        <tr>
                            <td>

                                    <span class="note-label">500</span>
                                </div>
                            </td>
                            <td>
                                <input type="number" id="note500" min="0" value="0" class="note-input" placeholder="0">
                            </td>
                            <td>
                                <div class="calculated-value" id="value500">0</div>
                            </td>
                        </tr>
                        <tr>
                            <td>

                            </td>

            </div>

            <div class="calculator-actions">
                <button class="btn btn-secondary" id="resetBtn">
                    <i class="fas fa-redo"></i> Reset

            </div>
        </div>
    </div>
</div>

{% block scripts %}
<script src="{{ url_for('static', filename='js/denomination_calculator.js') }}"></script>
{% endblock %}
